name: Teams Notification
description: Sends Buildkite job status to Microsoft Teams channels using incoming webhooks.
author: https://github.com/buildkite-plugins
requirements:
  - bash
  - curl
configuration:
  properties:
    webhook_url:
      type: string
    message:
      type: string
    dry_run:
      type: boolean
  required:
    - webhook_url
    - message
  additionalProperties: false
